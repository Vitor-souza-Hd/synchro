name: Verificar desempenho do Synchro
on:
  push:
    branches: [perf/recomendacoes-avaliacoes]
permissions:
  contents: read
jobs:
  verificar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Gerar miniatura do ícone
        run: |
          python3 -m venv /tmp/synchro-image
          /tmp/synchro-image/bin/pip -q install Pillow
          /tmp/synchro-image/bin/python - <<'PY'
          from PIL import Image
          icon = Image.open("src/main/resources/static/frontend/assets/images/personal-profile-icon.png").convert("RGBA")
          icon.thumbnail((84, 84), Image.Resampling.LANCZOS)
          icon.save("/tmp/profile-icon.webp", quality=85, method=6)
          PY
          echo "PROFILE_WEBP=$(base64 -w 0 /tmp/profile-icon.webp)"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - run: mvn -B -q test
