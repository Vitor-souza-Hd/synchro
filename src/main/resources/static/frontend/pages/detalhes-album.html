<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Álbum - Synchro</title>

    <link rel="stylesheet" href="/frontend/assets/css/explorar/style.css">
    <link rel="stylesheet" href="/frontend/assets/css/explorar/musica.css">
    <link rel="stylesheet" href="/frontend/assets/css/explorar/album.css">

    <link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css">
<link rel="stylesheet" href="/frontend/assets/css/auth.css">
<link rel="stylesheet" href="/frontend/assets/css/features.css">
<script src="/frontend/assets/js/features.js?v=20261105-catalog-interactions-1" defer></script>
<script src="/frontend/assets/js/auth.js" defer></script>
<script src="/frontend/assets/js/explorar/tema-global.js"></script>
<link rel="stylesheet" href="/frontend/assets/css/search.css">
<script src="/frontend/assets/js/search.js?v=20261105-single-search-1" defer></script>
</head>
<body>
<div class="feature-session"><div id="authActions"><a href="/frontend/pages/login.html">Entrar</a> <a href="/frontend/pages/formulario.html">Criar conta</a></div><div class="session-actions" hidden><button class="logout-button" type="button">Sair</button><p class="session-error" role="alert" hidden></p></div></div>

<div class="container">
    <aside class="sidebar">
        <div class="logo">
            <i class="bx bx-pulse"></i>
            <a href="//frontend/pages/explorar.html">SYNCHRO</a>
        </div>
        <div class="menu">
            <h5>Menu</h5>
            <ul>
                <li><i class="bx bxs-bolt-circle"></i><a href="//frontend/pages/explorar.html">Explorar</a></li>
                <li><i class="bx bxs-volume-full"></i><a href="#">Gêneros</a></li>
                <li><i class="bx bxs-album"></i><a href="#">Álbuns</a></li>
                <li><i class="bx bxs-microphone"></i><a href="#">Artistas</a></li>
            </ul>
        </div>
        <div class="nav-footer">
            <a href="#">Sobre o Synchro</a>
        </div>
    </aside>

    <main>
        <header class="search-bar">
            <div class="search-box">
                <i class="fa-solid fa-magnifying-glass"></i>
                <input class="search" type="text" placeholder="O que você quer ouvir?">
            </div>
            <div class="nav-links">
                <a href="//frontend/pages/explorar.html">Início</a>
            </div>
        </header>

        <section class="music-header">
            <div class="music-cover">
                <div id="albumPlaceholder" class="music-placeholder">
                    <i class="bx bx-album"></i>
                </div>
            </div>
            <div class="music-info">
                <span class="music-label">ÁLBUM</span>
                <h1 id="albumName">Carregando...</h1>
                <p id="albumArtist" style="color: #b3b3b3; font-size: 1.2rem; margin-top: 10px;">
                    Carregando artista...
                </p>
            </div>
        </section>

        <section class="music-section">
            <h2>Músicas deste Álbum</h2>
            <div id="trackList" style="margin-top: 20px;"></div>
        </section>

        <section class="music-section" id="albumReviewSection">
            <h2>Avaliações da comunidade</h2>
            <p id="albumReviewStatus" role="status" style="color: #1db954; margin-bottom: 20px;">Carregando avaliações...</p>

            <div id="albumReviewControls">
                <p id="albumReviewAverage" style="color: #b3b3b3; margin-bottom: 20px; font-size: 15px;"></p>

                <div id="albumReviewEditor">
                    <label>Sua nota (1 a 10)</label>

                    <div class="rating-scale" id="albumRatingScale">
                        <div class="rating-item" data-value="1"><span>1</span><div class="bar"></div></div>
                        <div class="rating-item" data-value="2"><span>2</span><div class="bar"></div></div>
                        <div class="rating-item" data-value="3"><span>3</span><div class="bar"></div></div>
                        <div class="rating-item" data-value="4"><span>4</span><div class="bar"></div></div>
                        <div class="rating-item" data-value="5"><span>5</span><div class="bar"></div></div>
                        <div class="rating-item" data-value="6"><span>6</span><div class="bar"></div></div>
                        <div class="rating-item" data-value="7"><span>7</span><div class="bar"></div></div>
                        <div class="rating-item" data-value="8"><span>8</span><div class="bar"></div></div>
                        <div class="rating-item" data-value="9"><span>9</span><div class="bar"></div></div>
                        <div class="rating-item" data-value="10"><span>10</span><div class="bar"></div></div>
                    </div>

                    <input type="hidden" id="albumReviewRating" value="8">

                    <label for="albumReviewText">Seu comentário</label>
                    <textarea id="albumReviewText" rows="3" maxlength="1000" placeholder="O que você achou deste álbum?"></textarea>

                    <div class="music-review-actions">
                        <button id="saveAlbumReview" type="button">Publicar avaliação</button>
                        <button id="cancelAlbumReview" type="button">Limpar</button>
                    </div>
                    <p id="albumReviewFeedback" role="status" style="color:#ff4d4d; margin-top:10px;"></p>
                </div>
            </div>

            <div id="albumReviewList" style="margin-top: 20px;"></div>
        </section>
    </main>
</div>

<script src="/frontend/assets/js/explorar/album.js"></script>
</body>
</html>
