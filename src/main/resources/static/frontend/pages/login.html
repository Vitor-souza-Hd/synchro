<!DOCTYPE html>

<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
<link
    href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css"
    rel="stylesheet">
<link rel="stylesheet" href="../assets/css/login.css?v=20261023-1">
<title>Synchro - Login</title>
</head>

<body>
<main class="container">

    <!-- VÍDEO DE FUNDO -->
    <video autoplay loop muted playsinline class="background-video">
        <source src="../assets/videos/background-blur-video.mp4" type="video/mp4">
    </video>

    <!-- CAMADA ESCURA SOBRE O VÍDEO -->
    <div class="overlay"></div>

    <!-- LOGIN -->
    <form class="login">

        <div class="logo">
            <h1>Synchro</h1>
            <p>Entre na sua conta</p>
        </div>

        <div class="input-box">
            <input
                type="text"
                name="username"
                placeholder="Usuário ou e-mail"
                autocomplete="username"
                required>

            <i class="bx bx-user"></i>
        </div>

        <div class="input-box">
            <input
                type="password"
                placeholder="Senha"
                autocomplete="current-password"
                minlength="6"
                required>

            <i class="bx bx-lock-alt"></i>
        </div>

        <div class="remember-forgot">

            <label>
                <input type="checkbox" id="remember-me">
                <span>Lembrar-me</span>
            </label>

            <a href="#">Esqueci minha senha</a>

        </div>

        <button type="submit">
            Entrar
        </button>

        <div class="divider">
            <span>ou</span>
        </div>

        <div class="register-link">
            <p>
                Não tem uma conta?
                <a href="formulario.html">
                    Registrar-se
                </a>
            </p>
        </div>

    </form>

</main>

<script src="../assets/js/login.js?v=20261023-1"></script>
</body>
</html>
