<!doctype html>
<html lang="pt-BR">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Encontrar pessoas | Synchro</title>
    <script src="/frontend/assets/js/explorar/tema-global.js"></script>
    <link rel="stylesheet" href="/frontend/assets/css/people-search.css?v=amizades">
    <script src="/frontend/assets/js/people-search.js" defer></script>
    <script src="/frontend/assets/js/friendships.js" defer></script>
</head>
<body>
    <header class="people-header">
        <nav aria-label="Navegação principal">
            <a href="/frontend/pages/explorar.html" class="people-brand">SYNCHRO</a>
            <a href="/frontend/pages/perfil.html">Meu perfil</a>
        </nav>
    </header>
    <main>
        <h1>Encontrar pessoas</h1>
        <form id="peopleSearch" role="search" aria-label="Busca de usuários">
            <label for="peopleQuery">Nome ou @usuário</label>
            <div class="people-input">
                <input id="peopleQuery" name="q" type="search" maxlength="200" required autocomplete="off" placeholder="Nome ou @usuário">
                <button type="submit">Buscar</button>
            </div>
        </form>
        <p id="peopleStatus" role="status"></p>
        <ul id="peopleResults" aria-label="Perfis encontrados"></ul>
        <nav id="peoplePages" class="people-pages" aria-label="Páginas de resultados" hidden>
            <button id="peoplePrevious" type="button">Anterior</button>
            <span id="peoplePageNumber"></span>
            <button id="peopleNext" type="button">Próxima</button>
        </nav>

        <section id="amizades" class="people-friendships" aria-labelledby="friendshipsHeading">
            <h2 id="friendshipsHeading">Amizades</h2>
            <p id="friendshipListStatus" role="status">Carregando amizades…</p>
            <a id="friendshipListLogin" href="/frontend/pages/login.html" hidden>Entrar na conta</a>
            <button id="friendshipListRetry" type="button" hidden>Tentar novamente</button>
            <div id="friendshipLists" hidden>
                <section>
                    <h3>Pedidos recebidos</h3>
                    <p data-friendship-empty="RECEIVED">Nenhum pedido recebido.</p>
                    <ul class="friendship-list" data-friendship-list="RECEIVED"></ul>
                </section>
                <section>
                    <h3>Pedidos enviados</h3>
                    <p data-friendship-empty="SENT">Nenhum pedido enviado.</p>
                    <ul class="friendship-list" data-friendship-list="SENT"></ul>
                </section>
                <section>
                    <h3>Amigos</h3>
                    <p data-friendship-empty="FRIENDS">Você ainda não adicionou amigos.</p>
                    <ul class="friendship-list" data-friendship-list="FRIENDS"></ul>
                </section>
            </div>
        </section>
    </main>
</body>
</html>
