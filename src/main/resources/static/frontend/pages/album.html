<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Álbum - Synchro</title>

    <link rel="stylesheet" href="/frontend/assets/css/explorar/style.css?v=shared-sidebar-1">
    <link rel="stylesheet" href="/frontend/assets/css/explorar/musica.css">
    <link rel="stylesheet" href="/frontend/assets/css/explorar/album.css?v=shared-sidebar-1">

    <link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css">
<link rel="stylesheet" href="/frontend/assets/css/auth.css">
<link rel="stylesheet" href="/frontend/assets/css/features.css">
<script src="/frontend/assets/js/features.js?v=cabecalho-estatico" defer></script>
<script src="/frontend/assets/js/auth.js?v=moderacao-roles" defer></script>
<script src="/frontend/assets/js/explorar/tema-global.js"></script>
<link rel="stylesheet" href="/frontend/assets/css/search.css">
<link rel="stylesheet" href="/frontend/assets/css/catalog.css">
<script src="/frontend/assets/js/search.js?v=username-publico" defer></script>
    <link rel="stylesheet" href="/frontend/assets/css/post-discussion.css?v=sino-cabecalho">
    <script src="/frontend/assets/js/post-notifications.js?v=username-publico" defer></script>
    <link rel="stylesheet" href="/frontend/assets/css/site-header.css?v=sino-e-sair">
    <script src="/frontend/assets/js/site-header.js?v=barra-e-menu" defer></script>
    <link rel="stylesheet" href="/frontend/assets/css/catalog-image-refresh.css">
    <link rel="stylesheet" href="/frontend/assets/css/moderation.css?v=vvip-avaliacoes">
    <script src="/frontend/assets/js/moderation.js?v=vvip-avaliacoes"></script>
</head>
<body>
<div class="feature-session"><div id="authActions"><a href="/frontend/pages/login.html">Entrar</a> <a href="/frontend/pages/formulario.html">Criar conta</a></div></div>

<div class="container">
    <aside class="sidebar">
        <div class="logo">
            <i class="bx bx-pulse"></i>
            <a href="/frontend/pages/explorar.html">SYNCHRO</a>
        </div>
        <div class="menu">
            <h5>Menu</h5>
            <ul>
                <li><i class="bx bxs-bolt-circle"></i><a href="/frontend/pages/explorar.html">Explorar</a></li>
                <li><i class="bx bxs-volume-full"></i><a href="#">Gêneros</a></li>
                <li><i class="bx bxs-album"></i><a href="#">Álbuns</a></li>
                <li><i class="bx bxs-microphone"></i><a href="#">Artistas</a></li>
                <li><i class="bx bxs-star" aria-hidden="true"></i><a href="/frontend/pages/recomendacoes.html">Recomendações</a></li>
            </ul>
        </div>
        <div class="nav-footer">
            <a href="#">Sobre o Synchro</a>
        </div>
    </aside>

    <main>

        <div id="header-container">
            <header class="top-header">
                <button class="menu-toggle" type="button" aria-label="Abrir menu"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16"/></svg></button>
                <div class="search-box">
                    <i aria-hidden="true"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 4 4"/></svg></i>
                    <input class="search" type="search" placeholder="Buscar música ou pessoas" aria-label="Buscar música ou pessoas" autocomplete="off">
                </div>
                <nav class="nav-links" aria-label="Navegação principal">
                    <a href="/frontend/pages/explorar.html">Início</a>
                    <a href="/frontend/pages/pessoas.html">Pessoas</a>
                    <a href="/frontend/pages/explorar.html#pesquisa">Músicas</a>
                    <a href="/frontend/pages/explorar.html#artistas">Artistas</a>
                    <a href="/frontend/pages/configuracoes.html" aria-label="Configurações" title="Configurações"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><circle cx="12" cy="12" r="3"/><path d="M9.5 3h5l.6 2.5 2 .9 2.3-1 2.5 4.3-1.9 1.7v2.2l1.9 1.7-2.5 4.3-2.3-1-2 .9-.6 2.5h-5l-.6-2.5-2-.9-2.3 1-2.5-4.3L4 13.6v-2.2L2.1 9.7l2.5-4.3 2.3 1 2-.9z"/></svg></a>
                    <div class="profile-header-actions">
                        <div class="session-actions" hidden><button class="logout-button" type="button">Sair</button><p class="session-error" role="alert" hidden></p></div>
                        <a class="profile-notifications-link" href="/frontend/pages/notificacoes.html" data-post-notifications-link aria-label="Notificações" title="Notificações">
                        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9M10 21h4"/></svg>
                        <span class="post-notifications-count" data-post-notifications-badge hidden></span>
                        </a>
                        <a href="/frontend/pages/perfil.html" aria-label="Meu perfil"><img class="personal-profile-icon" src="/frontend/assets/images/personal-profile-icon.png" width="28" height="28" alt=""></a>
                    </div>
                </nav>
            </header>
        </div>

        <p id="catalogStatus" role="status">Carregando álbum...</p>
        <div id="catalogContent" hidden>
            <section class="music-header">
                <div class="music-cover">
                    <img id="catalogImage" decoding="async" fetchpriority="high" src="../assets/images/catalog-placeholder.svg" alt="">
                </div>
                <div class="music-info">
                    <span class="music-label">ÁLBUM</span>
                    <h1 id="albumName"><span id="catalogTitle"></span></h1>
                    <div id="catalogArtists" class="catalog-artists"></div>
                    <p id="catalogMeta" class="catalog-meta"></p>
                    <div class="catalog-image-tools" id="catalogImageTools" hidden>
                        <button id="refreshCatalogImage" type="button">Buscar nova imagem</button>
                        <span id="catalogImageStatus" role="status"></span>
                    </div>
                    <div class="music-review-actions"><button id="favoriteBtn" type="button" aria-pressed="false">♡ Favoritar</button></div>
                </div>
            </section>

            <section class="music-section">
                <h2>Músicas deste Álbum</h2>
                <div id="catalogTracks"></div>
            </section>

            <section class="music-section">
                <h2>Sobre o álbum</h2>
                <p id="catalogDescription"></p>
            </section>

            <section class="music-section" id="albumReviewSection">
                <h2>Avaliações da comunidade</h2>
                <p id="albumReviewStatus" role="status" style="color: #1db954; margin-bottom: 20px;">Carregando avaliações...</p>

                <div id="albumReviewControls">
                    <p id="albumReviewAverage" style="color: #b3b3b3; margin-bottom: 20px; font-size: 15px;"></p>

                    <div id="albumReviewEditor">
                        <label>Sua nota (1 a 10)</label>

                        <div class="rating-scale" id="albumRatingScale">
                            <div class="rating-item" data-value="1"><span>1</span><div class="bar"></div></div>
                            <div class="rating-item" data-value="2"><span>2</span><div class="bar"></div></div>
                            <div class="rating-item" data-value="3"><span>3</span><div class="bar"></div></div>
                            <div class="rating-item" data-value="4"><span>4</span><div class="bar"></div></div>
                            <div class="rating-item" data-value="5"><span>5</span><div class="bar"></div></div>
                            <div class="rating-item" data-value="6"><span>6</span><div class="bar"></div></div>
                            <div class="rating-item" data-value="7"><span>7</span><div class="bar"></div></div>
                            <div class="rating-item" data-value="8"><span>8</span><div class="bar"></div></div>
                            <div class="rating-item" data-value="9"><span>9</span><div class="bar"></div></div>
                            <div class="rating-item" data-value="10"><span>10</span><div class="bar"></div></div>
                        </div>

                        <input type="hidden" id="albumReviewRating" value="8">

                        <label for="albumReviewText">Seu comentário</label>
                        <textarea id="albumReviewText" rows="3" maxlength="1000" placeholder="O que você achou deste álbum?"></textarea>

                        <div class="music-review-actions">
                            <button id="saveAlbumReview" type="button">Publicar avaliação</button>
                            <button id="cancelAlbumReview" type="button">Limpar</button>
                        </div>
                        <p id="albumReviewFeedback" role="status" style="color:#ff4d4d; margin-top:10px;"></p>
                    </div>
                </div>

                <div id="albumReviewList" style="margin-top: 20px;"></div>
            </section>
        </div>
    </main>
</div>

<script src="/frontend/assets/js/explorar/album.js?v=vvip-avaliacoes"></script>
<script src="/frontend/assets/js/explorar/recentes.js?v=20261110-images"></script>
<script src="/frontend/assets/js/explorar/favorite-images.js?v=buscar-outra"></script>
<script src="/frontend/assets/js/catalog-image-refresh.js"></script>
<script src="/frontend/assets/js/media.js?v=buscar-outra" defer></script>
</body>
</html>
