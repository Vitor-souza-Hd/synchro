<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Perfil público | Synchro</title>
    <link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css">
    <link rel="stylesheet" href="/frontend/assets/css/explorar/style.css?v=shared-sidebar-1">
    <link rel="stylesheet" href="/frontend/assets/css/explorar/user.css?v=weekly-music-genres">
    <link rel="stylesheet" href="/frontend/assets/css/explorar/tema-usuario.css?v=20261105-compact-profile-1">
    <link rel="stylesheet" href="/frontend/assets/css/search.css">
    <link rel="stylesheet" href="/frontend/assets/css/auth.css">
    <link rel="stylesheet" href="/frontend/assets/css/features.css">
    <script src="/frontend/assets/js/explorar/tema-global.js"></script>
    <script src="/frontend/assets/js/auth.js" defer></script>
    <script src="/frontend/assets/js/user.js?v=perfis-separados" defer></script>
    <script src="/frontend/assets/js/search.js?v=busca-eficiente" defer></script>
</head>
<body class="synchro-usuario" data-profile="public">
<div class="feature-session">
    <div id="authActions">
        <a href="/frontend/pages/login.html">Entrar</a>
        <a href="/frontend/pages/formulario.html">Criar conta</a>
    </div>
    <div class="session-actions" hidden>
        <button class="logout-button" type="button">Sair</button>
        <p class="session-error" role="alert" hidden></p>
    </div>
</div>
<p id="profileStatus" role="status">Carregando perfil…</p>
<p id="profileError" role="alert" hidden></p>
<div class="container" id="profilePage" hidden>
    <aside class="sidebar" id="profileSidebar" aria-label="Menu principal">
        <button class="profile-menu-close" type="button" aria-label="Fechar menu lateral">&times;</button>
        <div class="logo"><i class="bx bx-pulse" aria-hidden="true"></i><a href="/frontend/pages/explorar.html">SYNCHRO</a></div>
        <nav class="menu" aria-label="Explorar catálogo">
            <h5>Menu</h5>
            <ul>
                <li><i class="bx bxs-bolt-circle" aria-hidden="true"></i><a href="/frontend/pages/explorar.html">Explorar</a></li>
                <li><i class="bx bxs-volume-full" aria-hidden="true"></i><a href="/frontend/pages/explorar.html#generos">Gêneros</a></li>
                <li><i class="bx bxs-album" aria-hidden="true"></i><a href="/frontend/pages/explorar.html#albuns">Álbuns</a></li>
                <li><i class="bx bxs-microphone" aria-hidden="true"></i><a href="/frontend/pages/explorar.html#artistas">Artistas</a></li>
            </ul>
        </nav>
    </aside>
    <main>
        <header class="top-header">
            <button class="menu-toggle" type="button" aria-label="Abrir menu" aria-controls="profileSidebar" aria-expanded="false"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16"/></svg></button>
            <div class="search-box">
                <i class="fa-solid fa-magnifying-glass"></i>
                <input class="search" type="search" aria-label="Buscar no Synchro">
            </div>
            <nav class="nav-links" aria-label="Navegação do site">
                <a href="/index.html">Início</a>
                <a href="/frontend/pages/pessoas.html">Pessoas</a>
                <a href="/frontend/pages/perfil.html">Meu perfil</a>
            </nav>
        </header>
        <section class="profile-header" aria-labelledby="profileHeading">
            <div class="banner-background"></div>
            <div class="banner-content">
                <div class="user" id="profileIdentity">
                    <div class="user-card">
                        <img id="profileImage" decoding="async" src="../assets/images/user/userphoto.jpg" alt="Foto de perfil">
                        <h3 id="profileName"></h3>
                        <p id="profileUsername"></p>
                    </div>
                </div>
                <div class="banner-info">
                    <h1 id="profileHeading">Perfil público</h1>
                    <button id="followProfile" type="button" class="lastfm-button lastfm-button-secondary" hidden>Seguir</button>
                    <p id="followProfileStatus" role="status"></p>
                    <p id="profileLastFm"></p>
                    <div id="lastFmDetails" class="lastfm-details" hidden>
                        <a id="lastFmProfileLink" target="_blank" rel="noopener noreferrer">Ver perfil no Last.fm ↗</a>
                    </div>
                    <div class="profile-stats">
                        <div><h3 id="profileScrobbles">—</h3><p>Synchs</p></div>
                        <div><h3 id="profileArtists">—</h3><p>Artistas</p></div>
                        <div id="lastFmTracksStat" hidden><h3 id="profileTracks">—</h3><p>Faixas</p></div>
                        <div id="lastFmAlbumsStat" hidden><h3 id="profileAlbums">—</h3><p>Álbuns</p></div>
                    </div>
                </div>
            </div>
        </section>
    </main>
</div>
</body>
</html>
