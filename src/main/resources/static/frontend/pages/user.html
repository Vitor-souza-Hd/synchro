<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SYNCHRO | Meu perfil</title>
    <link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css">
    <link rel="stylesheet" href="../assets/css/user.css?v=20261023-1">
    <style>
        .profile-status {
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 24px;
            color: #fff;
            text-align: center;
        }
    </style>
    <!-- Início do trecho adicionado por IA -->
    <link rel="stylesheet" href="/frontend/assets/css/search.css">
    <script src="/frontend/assets/js/search.js" defer></script>
    <!-- Fim do trecho adicionado por IA -->
</head>
<body>
    <div id="profileStatus" class="profile-status" role="status">Carregando seu perfil...</div>

    <div class="container" id="profilePage" hidden>
        <header class="top-header">
            <div class="logo">
                <i class="bx bx-pulse"></i>
                <a href="../../index.html">SYNCHRO</a>
            </div>

            <div class="search-box">
                <i class="fa-solid fa-magnifying-glass"></i>
                <input class="search" type="text" placeholder="O que você quer ouvir?" aria-label="Buscar música">
            </div>

            <nav class="nav-links" aria-label="Navegação principal">
                <a href="../../index.html" aria-label="Página inicial"><i class="fa-solid fa-house"></i></a>
            </nav>
        </header>

        <main>
            <section class="profile-header" aria-labelledby="profileName">
                <div class="banner-background"></div>
                <div class="banner-content">
                    <div class="user" id="profileIdentity">
                        <div class="user-card">
                            <img id="profileImage" src="../assets/images/user/userphoto.jpg" alt="Foto de perfil">
                            <h3 id="profileName"></h3>
                            <p id="profileUsername"></p>
                        </div>
                    </div>

                    <div class="banner-info">
                        <h1>Meu perfil</h1>
                        <p id="profileEmail"></p>
                        <p id="profileBirthDay"></p>
                        <p id="profileGender"></p>
                        <p id="profileLastFm"></p>

                        <div class="profile-stats">
                            <div>
                                <h3 id="profileScrobbles">0</h3>
                                <p>Scrobbles</p>
                            </div>
                            <div>
                                <h3 id="profileArtists">0</h3>
                                <p>Artistas</p>
                            </div>
                        </div>
                        <span>PERFIL</span>
                    </div>
                </div>
            </section>
        </main>
    </div>

    <div id="profileError" class="profile-status profile-error" role="alert" hidden></div>
    <script src="../assets/js/user.js?v=20261023-2"></script>
</body>
</html>
