spring.main.web-application-type=none
spring.datasource.url=${LASTFM_IMPORT_DB_URL:jdbc:h2:file:./data/synchro}
spring.datasource.driver-class-name=${LASTFM_IMPORT_DB_DRIVER:org.h2.Driver}
spring.datasource.username=${LASTFM_IMPORT_DB_USER:sa}
spring.datasource.password=${LASTFM_IMPORT_DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.h2.console.enabled=false
